[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deadlock-sim"
version = "0.1.0"
description = "Deadlock Prevention, Avoidance, and Recovery: A Quantitative Trade-off Analysis"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0,<3.0",
    "pandas>=2.0,<3.0",
    "matplotlib>=3.0,<4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
